name: Bug report
description: Report a problem with VBAN Plug TX, RX, or the installer.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: VBAN Plug version
      placeholder: "0.3.0 dev"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Operating system and audio host versions
      placeholder: "Windows 11 x64 or macOS version + Apple Silicon/Intel, host name and version"
    validations:
      required: true
  - type: textarea
    id: audio
    attributes:
      label: Audio and network setup
      description: Include sample rate, host block size, TX/RX, PCM format, 1-8 stream channels, host channel layout, and whether this is one computer or two. Exact IP addresses are not needed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, what happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: counters
    attributes:
      label: Packet counters, status, or screenshots
      description: Include the visible status and whether the TX/RX counters and meters move.
